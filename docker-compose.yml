# freitach as a Docker stack: `docker stack deploy -c docker-compose.yml freitach`
# (or `docker compose up -d`). Secrets and the domain come from the environment / .env.
services:
  app:
    image: ghcr.io/parns/futtarns:${TAG:-latest}
    environment:
      DATABASE_URL: postgres://freitach:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/freitach
      APP_URL: ${APP_URL:-https://freitach.arns.dev}
      BOT_URL: http://bot:3001
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      WHATSAPP_GROUP: ${WHATSAPP_GROUP:-}
      # Only used on the very first start, to create you as admin (login link in the logs).
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      - db
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    restart: unless-stopped

  bot:
    image: ghcr.io/parns/futtarns-bot:${TAG:-latest}
    environment:
      APP_INTERNAL_URL: http://app:3000
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      PAIRING_PHONE: ${PAIRING_PHONE:-}
    volumes:
      - bot-auth:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: freitach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: freitach
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freitach']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    restart: unless-stopped

volumes:
  db-data:
  bot-auth:
