# Coolify: New Resource → this repository → build pack "Docker Compose".
# Set ADMIN_NAME, ADMIN_PHONE and DB_PASSWORD under Environment Variables before the
# first deploy. Data lives on the host under /data/freitach, like park.fan's
# /data/parkfan, so it survives redeploys and even deleting the resource in Coolify.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freitach
      # Set once: Postgres keeps the password it was initialised with in its data
      # directory, so changing it here later locks the app out.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: freitach
    volumes:
      - /data/freitach/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freitach -d freitach']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-https://freitach.arns.dev}
      PORT: 3500
      DATABASE_URL: postgres://freitach:${DB_PASSWORD:?}@db:5432/freitach
      ADMIN_NAME: ${ADMIN_NAME:?}
      ADMIN_PHONE: ${ADMIN_PHONE:?}
      DEFAULT_RESTAURANT_NAME: ${DEFAULT_RESTAURANT_NAME:-Pizzeria Rustica}
      DEFAULT_RESTAURANT_URL: ${DEFAULT_RESTAURANT_URL:-https://www.lieferando.de/speisekarte/pizzeria-rustica-3?c_id=01a0f6bc-5014-7255-9c76-1fcad61fad69}
      PAIRING_PHONE: ${PAIRING_PHONE:-}
      WHATSAPP_GROUP: ${WHATSAPP_GROUP:-}
      WHATSAPP: ${WHATSAPP:-}
    volumes:
      # The WhatsApp login; without it the bot has to be linked again after every deploy.
      - /data/freitach/whatsapp:/data/whatsapp
    ports:
      # Only on the server itself: from outside, the site goes through Coolify's proxy
      # with HTTPS, never as plain HTTP on this port.
      - '127.0.0.1:3500:3500'
    depends_on:
      db:
        condition: service_healthy
